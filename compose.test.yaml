name: secunda-test

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: secunda_test
      MYSQL_USER: secunda_test
      MYSQL_PASSWORD: test-only-password
      MYSQL_ROOT_PASSWORD: test-only-root-password
    tmpfs: [/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1']
      interval: 2s
      timeout: 3s
      retries: 40
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 15

  test:
    build:
      context: .
      dockerfile: integration-test/Dockerfile
    environment:
      TEST_MYSQL_DSN: secunda_test:test-only-password@tcp(mysql:3306)/secunda_test?parseTime=true&charset=utf8mb4
      TEST_REDIS_URL: redis://redis:6379/0
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}

