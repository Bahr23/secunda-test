components:
    parameters:
        Cursor:
            allowEmptyValue: true
            description: Opaque signed continuation token. Use cursor= for the first cursor page, then next_cursor. Bound to the authenticated user, resource and filters. Mutually exclusive with offset, including offset=0. Changing limit is allowed. Missing next_cursor means the end. ID keyset order is not a frozen snapshot of mutable data.
            in: query
            name: cursor
            required: false
            schema:
                maxLength: 55
                type: string
    responses:
        Error400:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: Invalid input
        Error401:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: Missing or invalid credentials
        Error403:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: Forbidden operation
        Error404:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: Missing resource or membership (including resources in other teams)
        Error409:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: Duplicate resource, concurrent transaction or stale task version
        Error413:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: Request body exceeds 1 MiB
        Error415:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: Expected application/json
        Error429:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: Request budget exceeded. Retry after the indicated number of seconds.
            headers:
                Retry-After:
                    description: Minimum delay in seconds before retrying.
                    schema:
                        minimum: 1
                        type: integer
        Error500:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: Internal server error
        Error504:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: Request timeout
    schemas:
        Change:
            additionalProperties: false
            properties:
                new:
                    description: New JSON value of any type, including null.
                old:
                    description: Previous JSON value of any type, including null; null for task creation.
            required:
                - old
                - new
            type: object
        Comment:
            additionalProperties: false
            properties:
                content:
                    type: string
                created_at:
                    format: date-time
                    type: string
                id:
                    format: int64
                    minimum: 1
                    type: integer
                task_id:
                    format: int64
                    minimum: 1
                    type: integer
                user_id:
                    format: int64
                    minimum: 1
                    type: integer
            required:
                - id
                - task_id
                - user_id
                - content
                - created_at
            type: object
        CommentPage:
            additionalProperties: false
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/Comment'
                    type: array
                limit:
                    format: int64
                    maximum: 100
                    minimum: 1
                    type: integer
                next_cursor:
                    description: Present only in cursor mode when another page exists. Pass as cursor without changing resource or filters.
                    maxLength: 55
                    type: string
                offset:
                    description: Offset in legacy pagination; always zero in cursor mode.
                    format: int64
                    minimum: 0
                    type: integer
            required:
                - items
                - limit
                - offset
            type: object
        CreateCommentRequest:
            additionalProperties: false
            properties:
                content:
                    maxLength: 10000
                    minLength: 1
                    type: string
            required:
                - content
            type: object
        CreateTaskRequest:
            additionalProperties: false
            properties:
                assignee_id:
                    format: int64
                    minimum: 1
                    nullable: true
                    type: integer
                description:
                    default: ""
                    maxLength: 10000
                    type: string
                team_id:
                    format: int64
                    minimum: 1
                    type: integer
                title:
                    maxLength: 200
                    minLength: 1
                    type: string
            required:
                - team_id
                - title
            type: object
        CreateTeamRequest:
            additionalProperties: false
            properties:
                name:
                    maxLength: 100
                    minLength: 1
                    type: string
            required:
                - name
            type: object
        Error:
            additionalProperties: false
            properties:
                error:
                    additionalProperties: false
                    properties:
                        code:
                            type: string
                        message:
                            type: string
                        request_id:
                            type: string
                    required:
                        - code
                        - message
                        - request_id
                    type: object
            required:
                - error
            type: object
        Health:
            additionalProperties: false
            properties:
                status:
                    type: string
            required:
                - status
            type: object
        History:
            additionalProperties: false
            properties:
                changed_by:
                    format: int64
                    minimum: 1
                    type: integer
                changes:
                    additionalProperties:
                        $ref: '#/components/schemas/Change'
                    type: object
                created_at:
                    format: date-time
                    type: string
                id:
                    format: int64
                    minimum: 1
                    type: integer
                task_id:
                    format: int64
                    minimum: 1
                    type: integer
            required:
                - id
                - task_id
                - changed_by
                - changes
                - created_at
            type: object
        HistoryPage:
            additionalProperties: false
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/History'
                    type: array
                limit:
                    format: int64
                    maximum: 100
                    minimum: 1
                    type: integer
                next_cursor:
                    description: Present only in cursor mode when another page exists. Pass as cursor without changing resource or filters.
                    maxLength: 55
                    type: string
                offset:
                    description: Offset in legacy pagination; always zero in cursor mode.
                    format: int64
                    minimum: 0
                    type: integer
            required:
                - items
                - limit
                - offset
            type: object
        InviteRequest:
            additionalProperties: false
            properties:
                role:
                    default: member
                    description: Only the owner may invite an admin.
                    enum:
                        - admin
                        - member
                    type: string
                user_id:
                    format: int64
                    minimum: 1
                    type: integer
            required:
                - user_id
            type: object
        LoginRequest:
            additionalProperties: false
            properties:
                email:
                    format: email
                    type: string
                password:
                    format: password
                    type: string
            required:
                - email
                - password
            type: object
        Membership:
            additionalProperties: false
            properties:
                role:
                    enum:
                        - owner
                        - admin
                        - member
                    type: string
                team_id:
                    format: int64
                    minimum: 1
                    type: integer
                user_id:
                    format: int64
                    minimum: 1
                    type: integer
            required:
                - team_id
                - user_id
                - role
            type: object
        Performer:
            additionalProperties: false
            properties:
                closed_tasks:
                    format: int64
                    minimum: 0
                    type: integer
                name:
                    type: string
                user_id:
                    format: int64
                    minimum: 1
                    type: integer
            required:
                - user_id
                - name
                - closed_tasks
            type: object
        RegisterRequest:
            additionalProperties: false
            properties:
                email:
                    format: email
                    maxLength: 254
                    type: string
                name:
                    maxLength: 100
                    minLength: 1
                    type: string
                password:
                    description: 12–72 bytes; never returned or logged.
                    format: password
                    maxLength: 72
                    minLength: 12
                    type: string
            required:
                - email
                - password
                - name
            type: object
        RoleRequest:
            additionalProperties: false
            properties:
                role:
                    enum:
                        - admin
                        - member
                    type: string
            required:
                - role
            type: object
        Task:
            additionalProperties: false
            properties:
                assignee_id:
                    format: int64
                    minimum: 1
                    nullable: true
                    type: integer
                closed_at:
                    format: date-time
                    nullable: true
                    type: string
                created_at:
                    format: date-time
                    type: string
                created_by:
                    format: int64
                    minimum: 1
                    type: integer
                description:
                    type: string
                id:
                    format: int64
                    minimum: 1
                    type: integer
                status:
                    enum:
                        - todo
                        - in_progress
                        - done
                    type: string
                team_id:
                    format: int64
                    minimum: 1
                    type: integer
                title:
                    type: string
                updated_at:
                    format: date-time
                    type: string
                version:
                    format: int64
                    minimum: 1
                    type: integer
            required:
                - id
                - team_id
                - title
                - description
                - status
                - created_by
                - assignee_id
                - created_at
                - updated_at
                - closed_at
                - version
            type: object
        TaskPage:
            additionalProperties: false
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/Task'
                    type: array
                limit:
                    format: int64
                    maximum: 100
                    minimum: 1
                    type: integer
                next_cursor:
                    description: Present only in cursor mode when another page exists. Pass as cursor without changing resource or filters.
                    maxLength: 55
                    type: string
                offset:
                    description: Offset in legacy pagination; always zero in cursor mode.
                    format: int64
                    minimum: 0
                    type: integer
            required:
                - items
                - limit
                - offset
            type: object
        Team:
            additionalProperties: false
            properties:
                created_at:
                    format: date-time
                    type: string
                created_by:
                    format: int64
                    minimum: 1
                    type: integer
                id:
                    format: int64
                    minimum: 1
                    type: integer
                name:
                    type: string
                role:
                    enum:
                        - owner
                        - admin
                        - member
                    type: string
            required:
                - id
                - name
                - created_by
                - created_at
                - role
            type: object
        TeamPage:
            additionalProperties: false
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/Team'
                    type: array
                limit:
                    format: int64
                    maximum: 100
                    minimum: 1
                    type: integer
                next_cursor:
                    description: Present only in cursor mode when another page exists. Pass as cursor without changing resource or filters.
                    maxLength: 55
                    type: string
                offset:
                    description: Offset in legacy pagination; always zero in cursor mode.
                    format: int64
                    minimum: 0
                    type: integer
            required:
                - items
                - limit
                - offset
            type: object
        TeamStats:
            additionalProperties: false
            properties:
                average_close_seconds:
                    description: Average creation-to-close time for all currently done tasks; null if none.
                    format: double
                    nullable: true
                    type: number
                comment_count:
                    format: int64
                    minimum: 0
                    type: integer
                tasks_by_status:
                    additionalProperties: false
                    properties:
                        done:
                            format: int64
                            minimum: 0
                            type: integer
                        in_progress:
                            format: int64
                            minimum: 0
                            type: integer
                        todo:
                            format: int64
                            minimum: 0
                            type: integer
                    required:
                        - todo
                        - in_progress
                        - done
                    type: object
                team_id:
                    format: int64
                    minimum: 1
                    type: integer
                top_assignees:
                    description: Currently done tasks closed during the last 30 days, by current assignee; ties use ascending user_id.
                    items:
                        $ref: '#/components/schemas/Performer'
                    maxItems: 3
                    type: array
            required:
                - team_id
                - tasks_by_status
                - top_assignees
                - average_close_seconds
                - comment_count
            type: object
        Token:
            additionalProperties: false
            properties:
                access_token:
                    type: string
                token_type:
                    enum:
                        - Bearer
                    type: string
            required:
                - access_token
                - token_type
            type: object
        UpdateTaskRequest:
            additionalProperties: false
            minProperties: 2
            properties:
                assignee_id:
                    description: Omit to preserve, null to unassign. Assignee must belong to the same team.
                    format: int64
                    minimum: 1
                    nullable: true
                    type: integer
                description:
                    maxLength: 10000
                    type: string
                status:
                    enum:
                        - todo
                        - in_progress
                        - done
                    type: string
                title:
                    maxLength: 200
                    minLength: 1
                    type: string
                version:
                    format: int64
                    minimum: 1
                    type: integer
            required:
                - version
            type: object
        User:
            additionalProperties: false
            properties:
                created_at:
                    format: date-time
                    type: string
                email:
                    format: email
                    type: string
                id:
                    format: int64
                    minimum: 1
                    type: integer
                name:
                    type: string
            required:
                - id
                - email
                - name
                - created_at
            type: object
    securitySchemes:
        bearerAuth:
            bearerFormat: JWT
            scheme: bearer
            type: http
info:
    description: Team-scoped tasks, role-based access, atomic history, MySQL analytics and Redis caching. Bearer JWT is required except for registration, login and health checks. All timestamps use UTC. Response header X-Request-ID correlates requests with logs.
    title: Secunda Team Task API
    version: 1.0.0
openapi: 3.0.3
paths:
    /api/v1/login:
        post:
            operationId: auth_login
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LoginRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Token'
                    description: Success
                "400":
                    $ref: '#/components/responses/Error400'
                "401":
                    $ref: '#/components/responses/Error401'
                "403":
                    $ref: '#/components/responses/Error403'
                "404":
                    $ref: '#/components/responses/Error404'
                "409":
                    $ref: '#/components/responses/Error409'
                "413":
                    $ref: '#/components/responses/Error413'
                "415":
                    $ref: '#/components/responses/Error415'
                "429":
                    $ref: '#/components/responses/Error429'
                "500":
                    $ref: '#/components/responses/Error500'
                "504":
                    $ref: '#/components/responses/Error504'
            security: []
            summary: Issue a JWT access token
            tags:
                - auth
    /api/v1/register:
        post:
            operationId: auth_register
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RegisterRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/User'
                    description: Success
                "400":
                    $ref: '#/components/responses/Error400'
                "401":
                    $ref: '#/components/responses/Error401'
                "403":
                    $ref: '#/components/responses/Error403'
                "404":
                    $ref: '#/components/responses/Error404'
                "409":
                    $ref: '#/components/responses/Error409'
                "413":
                    $ref: '#/components/responses/Error413'
                "415":
                    $ref: '#/components/responses/Error415'
                "429":
                    $ref: '#/components/responses/Error429'
                "500":
                    $ref: '#/components/responses/Error500'
                "504":
                    $ref: '#/components/responses/Error504'
            security: []
            summary: Register a user
            tags:
                - auth
    /api/v1/tasks:
        get:
            operationId: tasks_list
            parameters:
                - in: query
                  name: team_id
                  required: true
                  schema:
                    format: int64
                    minimum: 1
                    type: integer
                - in: query
                  name: status
                  required: false
                  schema:
                    enum:
                        - todo
                        - in_progress
                        - done
                    type: string
                - in: query
                  name: assignee_id
                  required: false
                  schema:
                    format: int64
                    minimum: 1
                    type: integer
                - in: query
                  name: limit
                  required: false
                  schema:
                    default: 20
                    format: int64
                    maximum: 100
                    minimum: 1
                    type: integer
                - in: query
                  name: offset
                  required: false
                  schema:
                    default: 0
                    format: int64
                    minimum: 0
                    type: integer
                - $ref: '#/components/parameters/Cursor'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TaskPage'
                    description: Success
                "400":
                    $ref: '#/components/responses/Error400'
                "401":
                    $ref: '#/components/responses/Error401'
                "403":
                    $ref: '#/components/responses/Error403'
                "404":
                    $ref: '#/components/responses/Error404'
                "409":
                    $ref: '#/components/responses/Error409'
                "413":
                    $ref: '#/components/responses/Error413'
                "415":
                    $ref: '#/components/responses/Error415'
                "429":
                    $ref: '#/components/responses/Error429'
                "500":
                    $ref: '#/components/responses/Error500'
                "504":
                    $ref: '#/components/responses/Error504'
            summary: List tasks in a required team, cached for 5 minutes
            tags:
                - tasks
        post:
            operationId: tasks_create
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateTaskRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Task'
                    description: Success
                "400":
                    $ref: '#/components/responses/Error400'
                "401":
                    $ref: '#/components/responses/Error401'
                "403":
                    $ref: '#/components/responses/Error403'
                "404":
                    $ref: '#/components/responses/Error404'
                "409":
                    $ref: '#/components/responses/Error409'
                "413":
                    $ref: '#/components/responses/Error413'
                "415":
                    $ref: '#/components/responses/Error415'
                "429":
                    $ref: '#/components/responses/Error429'
                "500":
                    $ref: '#/components/responses/Error500'
                "504":
                    $ref: '#/components/responses/Error504'
            summary: Create task with initial history (any team member)
            tags:
                - tasks
    /api/v1/tasks/{id}:
        put:
            description: version and at least one mutable field are required. Omitted fields stay unchanged. Owner/admin and task creator may change all fields. An assignee who is not the creator may only change status. A no-op preserves version and history. Any listed status is allowed; done sets closed_at, reopening clears it. Stale version returns 409.
            operationId: tasks_update
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    minimum: 1
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateTaskRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Task'
                    description: Success
                "400":
                    $ref: '#/components/responses/Error400'
                "401":
                    $ref: '#/components/responses/Error401'
                "403":
                    $ref: '#/components/responses/Error403'
                "404":
                    $ref: '#/components/responses/Error404'
                "409":
                    $ref: '#/components/responses/Error409'
                "413":
                    $ref: '#/components/responses/Error413'
                "415":
                    $ref: '#/components/responses/Error415'
                "429":
                    $ref: '#/components/responses/Error429'
                "500":
                    $ref: '#/components/responses/Error500'
                "504":
                    $ref: '#/components/responses/Error504'
            summary: Update supplied fields using optimistic concurrency
            tags:
                - tasks
    /api/v1/tasks/{id}/comments:
        get:
            operationId: tasks_comments
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    minimum: 1
                    type: integer
                - in: query
                  name: limit
                  required: false
                  schema:
                    default: 20
                    format: int64
                    maximum: 100
                    minimum: 1
                    type: integer
                - in: query
                  name: offset
                  required: false
                  schema:
                    default: 0
                    format: int64
                    minimum: 0
                    type: integer
                - $ref: '#/components/parameters/Cursor'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CommentPage'
                    description: Success
                "400":
                    $ref: '#/components/responses/Error400'
                "401":
                    $ref: '#/components/responses/Error401'
                "403":
                    $ref: '#/components/responses/Error403'
                "404":
                    $ref: '#/components/responses/Error404'
                "409":
                    $ref: '#/components/responses/Error409'
                "413":
                    $ref: '#/components/responses/Error413'
                "415":
                    $ref: '#/components/responses/Error415'
                "429":
                    $ref: '#/components/responses/Error429'
                "500":
                    $ref: '#/components/responses/Error500'
                "504":
                    $ref: '#/components/responses/Error504'
            summary: List comments in ascending ID order (team members)
            tags:
                - tasks
        post:
            operationId: tasks_addComment
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    minimum: 1
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateCommentRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Comment'
                    description: Success
                "400":
                    $ref: '#/components/responses/Error400'
                "401":
                    $ref: '#/components/responses/Error401'
                "403":
                    $ref: '#/components/responses/Error403'
                "404":
                    $ref: '#/components/responses/Error404'
                "409":
                    $ref: '#/components/responses/Error409'
                "413":
                    $ref: '#/components/responses/Error413'
                "415":
                    $ref: '#/components/responses/Error415'
                "429":
                    $ref: '#/components/responses/Error429'
                "500":
                    $ref: '#/components/responses/Error500'
                "504":
                    $ref: '#/components/responses/Error504'
            summary: Add comment (team members)
            tags:
                - tasks
    /api/v1/tasks/{id}/history:
        get:
            operationId: tasks_history
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    minimum: 1
                    type: integer
                - in: query
                  name: limit
                  required: false
                  schema:
                    default: 20
                    format: int64
                    maximum: 100
                    minimum: 1
                    type: integer
                - in: query
                  name: offset
                  required: false
                  schema:
                    default: 0
                    format: int64
                    minimum: 0
                    type: integer
                - $ref: '#/components/parameters/Cursor'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HistoryPage'
                    description: Success
                "400":
                    $ref: '#/components/responses/Error400'
                "401":
                    $ref: '#/components/responses/Error401'
                "403":
                    $ref: '#/components/responses/Error403'
                "404":
                    $ref: '#/components/responses/Error404'
                "409":
                    $ref: '#/components/responses/Error409'
                "413":
                    $ref: '#/components/responses/Error413'
                "415":
                    $ref: '#/components/responses/Error415'
                "429":
                    $ref: '#/components/responses/Error429'
                "500":
                    $ref: '#/components/responses/Error500'
                "504":
                    $ref: '#/components/responses/Error504'
            summary: List history in ascending ID order (team members)
            tags:
                - tasks
    /api/v1/teams:
        get:
            operationId: teams_list
            parameters:
                - in: query
                  name: limit
                  required: false
                  schema:
                    default: 20
                    format: int64
                    maximum: 100
                    minimum: 1
                    type: integer
                - in: query
                  name: offset
                  required: false
                  schema:
                    default: 0
                    format: int64
                    minimum: 0
                    type: integer
                - $ref: '#/components/parameters/Cursor'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TeamPage'
                    description: Success
                "400":
                    $ref: '#/components/responses/Error400'
                "401":
                    $ref: '#/components/responses/Error401'
                "403":
